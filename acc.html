<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Profile · Connapp</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f9fc;color:#1a1a1a;min-height:100dvh;display:flex;flex-direction:column}
    a{text-decoration:none;color:inherit}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
    .back{width:40px;height:40px;border-radius:50%;border:none;background:#f3f4f6;font-size:18px;cursor:pointer}
    .logo{font-weight:600;font-size:15px}
    .header-actions{display:flex;gap:10px;font-size:13px;color:#4b5563;align-items:center}
    .header-actions a{padding:6px}
    main{flex:1;width:100%;max-width:560px;margin:0 auto;padding-bottom:max(24px,env(safe-area-inset-bottom))}
    .profile{background:#fff;padding:24px 16px 18px;text-align:center;border-bottom:1px solid #e5e7eb}
    .avatar{width:96px;height:96px;border-radius:50%;background:#e5e7eb;margin:0 auto 12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid #f3f4f6}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .name{font-size:20px;font-weight:700}
    .uname{font-size:14px;color:#6b7280;margin-top:2px}
    .bio{font-size:14px;color:#4b5563;margin-top:10px;line-height:1.45;max-width:360px;margin-left:auto;margin-right:auto}
    .meta{font-size:12px;color:#9ca3af;margin-top:8px}
    .actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
    .btn-primary{background:#1a56db;color:#fff}
    .btn-ghost{background:#f3f4f6;color:#374151}
    .section-label{padding:14px 16px 8px;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#e5e7eb}
    .grid .cell{aspect-ratio:1;background:#f3f4f6;overflow:hidden;position:relative;cursor:pointer}
    .grid .cell img{width:100%;height:100%;object-fit:cover;display:block}
    .empty{padding:40px 20px;text-align:center;color:#9ca3af;font-size:14px;background:#fff}
    .error{padding:16px;text-align:center;color:#b91c1c;font-size:13px}
    /* lightbox – one post at a time, no page scroll behind */
    .lb{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
    .lb.open{display:flex}
    .lb-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));color:#fff}
    .lb-top button{background:rgba(255,255,255,.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
    .lb-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
    .lb-body img{max-width:100%;max-height:100%;object-fit:contain}
    .lb-cap{padding:12px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom));color:#fff;font-size:14px;background:#111}
    .lb-del{margin-left:auto;background:#dc2626;border:none;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer}
  </style>
</head>
<body>
  <header>
    <button type="button" class="back" id="backBtn">←</button>
    <span class="logo" id="title">Profile</span>
    <div class="header-actions">
      <a href="post.html">Post</a>
      <a href="dash.html">Find</a>
    </div>
  </header>
  <main>
    <div id="err" class="error" style="display:none"></div>
    <div class="profile">
      <div class="avatar" id="avatar">👤</div>
      <div class="name" id="name">…</div>
      <div class="uname" id="uname"></div>
      <div class="bio" id="bio"></div>
      <div class="meta" id="meta"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="section-label">Posts</div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">No posts yet.</div>
  </main>

  <div class="lb" id="lb">
    <div class="lb-top">
      <button type="button" id="lbClose">×</button>
      <button type="button" class="lb-del" id="lbDel" style="display:none">Delete</button>
    </div>
    <div class="lb-body"><img id="lbImg" alt=""></div>
    <div class="lb-cap" id="lbCap"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    var URL='https://ktoyxbqybthleiiiiruv.supabase.co';
    var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3l4YnF5YnRobGVpaWlpcnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjgxMTEsImV4cCI6MjEwODk0NDExMX0.WXG-PEHLQemBthQNgiY8h4xPww-96cxUT2nPnOo1NH4';
    var params=new URLSearchParams(location.search);
    var profileId=params.get('id');
    var client=null,me=null,profile=null,posts=[],currentPost=null;

    function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function showErr(t){var e=document.getElementById('err');e.style.display='block';e.textContent=t}

    function openLb(p){
      currentPost=p;
      document.getElementById('lbImg').src=p.image_url;
      document.getElementById('lbCap').textContent=p.caption||'';
      document.getElementById('lbDel').style.display=(me&&p.user_id===me.id)?'block':'none';
      document.getElementById('lb').classList.add('open');
      document.body.style.overflow='hidden';
    }
    function closeLb(){
      document.getElementById('lb').classList.remove('open');
      document.body.style.overflow='';
      currentPost=null;
    }
    document.getElementById('lbClose').addEventListener('click',closeLb);
    document.getElementById('lbDel').addEventListener('click',function(){
      if(!currentPost||!me)return;
      if(!confirm('Delete this post?'))return;
      client.from('posts').delete().eq('id',currentPost.id).eq('user_id',me.id).then(function(r){
        if(r.error){alert(r.error.message);return}
        closeLb(); loadPosts();
      });
    });

    function loadPosts(){
      client.from('posts').select('*').eq('user_id',profileId).order('created_at',{ascending:false}).limit(60)
        .then(function(r){
          var grid=document.getElementById('grid'), empty=document.getElementById('empty');
          if(r.error){showErr(r.error.message);return}
          posts=r.data||[];
          if(!posts.length){grid.innerHTML='';empty.style.display='block';return}
          empty.style.display='none';
          grid.innerHTML=posts.map(function(p,i){
            return '<div class="cell" data-i="'+i+'"><img src="'+esc(p.image_url)+'" alt="" loading="lazy"></div>';
          }).join('');
          grid.querySelectorAll('.cell').forEach(function(cell){
            cell.addEventListener('click',function(){openLb(posts[+cell.dataset.i])});
          });
        });
    }

    function renderProfile(){
      document.getElementById('name').textContent=profile.full_name||profile.username||'User';
      document.getElementById('uname').textContent='@'+(profile.username||'');
      document.getElementById('bio').textContent=profile.bio||'';
      document.getElementById('title').textContent=profile.username||'Profile';
      document.title=(profile.username||'Profile')+' · Connapp';
      if(profile.avatar_url)document.getElementById('avatar').innerHTML='<img src="'+esc(profile.avatar_url)+'" alt="">';
      var bits=[];
      if(profile.gender)bits.push(profile.gender);
      document.getElementById('meta').textContent=bits.join(' · ');

      var actions=document.getElementById('actions');
      var isSelf=me&&me.id===profileId;
      if(isSelf){
        actions.innerHTML='<a class="btn btn-primary" href="post.html">New post</a><a class="btn btn-ghost" href="account.html">Edit profile</a>';
      } else {
        actions.innerHTML='<button type="button" class="btn btn-primary" id="chatBtn">Message</button>';
        document.getElementById('chatBtn').addEventListener('click',function(){
          location.href='chat.html?with='+encodeURIComponent(profileId)+'&u='+encodeURIComponent(profile.username||'');
        });
      }
    }

    function boot(){
      if(!profileId){location.href='dash.html';return}
      if(typeof window.supabase==='undefined'){showErr('CDN failed.');return}
      client=window.supabase.createClient(URL,KEY);
      client.auth.getSession().then(function(r){
        if(!r.data||!r.data.session){location.href='login.html';return}
        me=r.data.session.user;
        client.from('profiles').select('*').eq('id',profileId).single().then(function(pr){
          if(pr.error||!pr.data){showErr('User not found.');return}
          profile=pr.data;
          renderProfile();
          loadPosts();
        });
      });
    }
    document.getElementById('backBtn').addEventListener('click',function(){location.href='dash.html'});
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
  })();
  </script>
</body>
</html>
