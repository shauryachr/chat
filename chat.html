<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Chat · Connapp</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f4f8;color:#1a1a1a;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    a{text-decoration:none;color:inherit}
    header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid #e5e7eb;flex-shrink:0}
    .back{width:36px;height:36px;border-radius:50%;border:none;background:#f3f4f6;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .peer-av{width:40px;height:40px;border-radius:50%;background:#e5e7eb;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .peer-av img{width:100%;height:100%;object-fit:cover}
    .peer-info{flex:1;min-width:0}
    .peer-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .peer-uname{font-size:12px;color:#6b7280}
    .header-actions a{font-size:13px;color:#6b7280;padding:6px}
    .messages{flex:1;overflow-y:auto;padding:16px 12px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px}
    .msg{max-width:80%;display:flex;flex-direction:column}
    .msg.mine{align-self:flex-end}
    .msg.theirs{align-self:flex-start}
    .bubble{padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;word-break:break-word}
    .msg.mine .bubble{background:#1f2937;color:#fff;border-bottom-right-radius:4px}
    .msg.theirs .bubble{background:#fff;color:#1f2937;border:1px solid #e5e7eb;border-bottom-left-radius:4px}
    .meta{font-size:11px;color:#9ca3af;margin-top:3px;padding:0 4px}
    .msg.mine .meta{text-align:right}
    .composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e5e7eb;flex-shrink:0}
    .composer input{flex:1;padding:12px 14px;border:1px solid #e5e7eb;border-radius:999px;font-size:16px;outline:none;background:#f9fafb;min-width:0}
    .composer input:focus{border-color:#93c5fd;background:#fff}
    .composer button{width:44px;height:44px;border-radius:50%;border:none;background:#111;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
    .composer button:disabled{opacity:.4}
    .empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:14px;text-align:center;padding:32px}
    .error-banner{background:#fef2f2;color:#b91c1c;font-size:12px;padding:8px 12px;text-align:center}
  </style>
</head>
<body>
  <header>
    <button type="button" class="back" id="backBtn" title="Back">←</button>
    <div class="peer-av" id="peer-av">👤</div>
    <div class="peer-info">
      <div class="peer-name" id="peer-name">…</div>
      <div class="peer-uname" id="peer-uname"></div>
    </div>
    <div class="header-actions"><a href="dash.html">People</a></div>
  </header>
  <div id="error-banner" class="error-banner" style="display:none"></div>
  <div class="messages" id="messages"><div class="empty-state" id="empty">Loading…</div></div>
  <div class="composer">
    <input type="text" id="input" placeholder="Write a message" autocomplete="off" maxlength="4000">
    <button type="button" id="sendBtn" title="Send">↑</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    var URL='https://ktoyxbqybthleiiiiruv.supabase.co';
    var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3l4YnF5YnRobGVpaWlpcnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjgxMTEsImV4cCI6MjEwODk0NDExMX0.WXG-PEHLQemBthQNgiY8h4xPww-96cxUT2nPnOo1NH4';
    var params=new URLSearchParams(window.location.search);
    var peerId=params.get('with'), peerHint=params.get('u')||'';
    var client=null,me=null,channel=null;
    function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function showError(t){var el=document.getElementById('error-banner');el.textContent=t;el.style.display='block'}
    function fmt(iso){return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
    function append(m){
      var box=document.getElementById('messages');
      var empty=document.getElementById('empty');if(empty)empty.remove();
      if(box.querySelector('[data-id="'+m.id+'"]'))return;
      var isMine=m.sender_id===me.id;
      var div=document.createElement('div');
      div.className='msg '+(isMine?'mine':'theirs');div.dataset.id=m.id;
      div.innerHTML='<div class="bubble">'+esc(m.content)+'</div><div class="meta">'+fmt(m.created_at)+'</div>';
      box.appendChild(div);box.scrollTop=box.scrollHeight;
    }
    function loadHistory(){
      return client.from('messages').select('*')
        .or('and(sender_id.eq.'+me.id+',receiver_id.eq.'+peerId+'),and(sender_id.eq.'+peerId+',receiver_id.eq.'+me.id+')')
        .order('created_at',{ascending:true}).limit(200).then(function(r){
          if(r.error){showError('Could not load messages: '+r.error.message);return}
          var box=document.getElementById('messages');box.innerHTML='';
          if(!r.data||!r.data.length){box.innerHTML='<div class="empty-state" id="empty">No messages yet. Say hello.</div>';return}
          r.data.forEach(append);
        });
    }
    function send(){
      var text=(document.getElementById('input').value||'').trim();
      if(!text||!client||!me)return;
      var btn=document.getElementById('sendBtn');btn.disabled=true;
      client.from('messages').insert({sender_id:me.id,receiver_id:peerId,content:text}).select().single().then(function(r){
        btn.disabled=false;
        if(r.error){showError('Send failed: '+r.error.message);return}
        append(r.data);document.getElementById('input').value='';document.getElementById('input').focus();
      }).catch(function(e){btn.disabled=false;showError(e.message||'Send failed')});
    }
    function subscribe(){
      channel=client.channel('dm:'+[me.id,peerId].sort().join(':'))
        .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'receiver_id=eq.'+me.id},function(p){if(p.new.sender_id===peerId)append(p.new)})
        .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'sender_id=eq.'+me.id},function(p){if(p.new.receiver_id===peerId)append(p.new)})
        .subscribe(function(status){console.log('Realtime:',status)});
    }
    function boot(){
      if(!peerId){window.location.href='dash.html';return}
      if(typeof window.supabase==='undefined'){showError('Supabase CDN failed to load.');return}
      client=window.supabase.createClient(URL,KEY);
      client.auth.getSession().then(function(r){
        if(!r.data||!r.data.session){window.location.href='login.html';return}
        me=r.data.session.user;
        client.from('profiles').select('*').eq('id',peerId).single().then(function(pr){
          var p=pr.data;
          if(p){
            document.getElementById('peer-name').textContent=p.full_name||p.username;
            document.getElementById('peer-uname').textContent='@'+p.username;
            if(p.avatar_url)document.getElementById('peer-av').innerHTML='<img src="'+esc(p.avatar_url)+'" alt="">';
            document.title=(p.username||'Chat')+' · Connapp';
          } else {
            document.getElementById('peer-name').textContent=peerHint||'Unknown';
          }
        });
        loadHistory().then(subscribe);
      });
    }
    document.getElementById('backBtn').addEventListener('click',function(){window.location.href='dash.html'});
    document.getElementById('sendBtn').addEventListener('click',send);
    document.getElementById('input').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();send()}});
    window.addEventListener('beforeunload',function(){if(channel&&client)client.removeChannel(channel)});
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
  })();
  </script>
</body>
</html>
