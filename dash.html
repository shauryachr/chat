<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Dashboard · Connapp</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#e8f0fe 0%,#f0f4f8 50%,#fff 100%);color:#1a1a1a;min-height:100dvh;display:flex;flex-direction:column}
    a{text-decoration:none;color:inherit}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10;gap:8px}
    .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;user-select:none;-webkit-user-select:none}
    .logo-icon{width:28px;height:28px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
    .header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .header-actions a,.header-actions button{font-size:13px;color:#4b5563;background:none;border:none;cursor:pointer;font-family:inherit;padding:6px 4px}
    .me-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:#374151;padding:4px 10px;background:#f3f4f6;border-radius:999px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .me-chip .av{width:22px;height:22px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;overflow:hidden}
    .me-chip .av img{width:100%;height:100%;object-fit:cover}
    main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:20px 14px 40px}
    h1{font-size:22px;font-weight:700;margin-bottom:4px}
    .sub{font-size:13px;color:#6b7280;margin-bottom:16px}
    .search-box{display:flex;gap:8px;margin-bottom:14px}
    .search-box input{flex:1;padding:12px 14px;border:1px solid #e5e7eb;border-radius:999px;font-size:16px;background:#fff;outline:none;min-width:0}
    .search-box input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
    .search-box button{padding:0 16px;border-radius:999px;border:none;background:#1a56db;color:#fff;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
    .results{display:flex;flex-direction:column;gap:8px}
    .user-card{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:14px;border:1px solid #f3f4f6;cursor:pointer}
    .user-card:active{border-color:#bfdbfe;background:#f8fafc}
    .user-card .av{width:44px;height:44px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
    .user-card .av img{width:100%;height:100%;object-fit:cover}
    .user-card .info{flex:1;min-width:0}
    .user-card .name{font-weight:600;font-size:15px}
    .user-card .uname{font-size:13px;color:#6b7280}
    .user-card .bio{font-size:12px;color:#9ca3af;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-card .go{font-size:13px;color:#1a56db;font-weight:500;flex-shrink:0}
    .empty,.loading,.error{text-align:center;padding:28px 14px;color:#9ca3af;font-size:14px}
    .error{color:#dc2626}
    .hint{font-size:12px;color:#9ca3af;margin-top:12px;text-align:center;line-height:1.4}
    /* Hidden vault modal */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:flex-end;justify-content:center}
    .modal-bg.open{display:flex}
    .modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:70dvh;padding:20px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
    .modal h2{font-size:18px;margin-bottom:4px}
    .modal p{font-size:13px;color:#6b7280;margin-bottom:14px}
    .modal .close{float:right;border:none;background:#f3f4f6;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
    .unhide-btn{font-size:12px;border:none;background:#eff6ff;color:#1a56db;padding:6px 10px;border-radius:999px;cursor:pointer;margin-left:auto}
  </style>
</head>
<body>
  <header>
    <div class="logo" id="logoTap" title="Connapp">
      <span class="logo-icon">▣</span>Connapp
    </div>
    <div class="header-actions">
      <div class="me-chip"><span class="av" id="me-av">👤</span><span id="me-name">…</span></div>
      <a href="account.html">Account</a>
      <button type="button" id="logoutBtn">Log out</button>
    </div>
  </header>
  <main>
    <h1>Find people</h1>
    <p class="sub">Search by username or name, then open a private chat.</p>
    <div class="search-box">
      <input type="text" id="q" placeholder="Search username or name…" autocomplete="off">
      <button type="button" id="searchBtn">Search</button>
    </div>
    <div id="status" class="loading" style="display:none">Searching…</div>
    <div id="results" class="results"></div>
    <p class="hint">Tap a person to chat.<br>Triple-tap the <strong>Connapp</strong> logo to open hidden chats.</p>
  </main>

  <div class="modal-bg" id="vaultModal">
    <div class="modal">
      <button type="button" class="close" id="closeVault">×</button>
      <h2>Hidden chats</h2>
      <p>Chats you hid. Tap Unhide to show them in search again, or open to chat.</p>
      <div id="vaultList" class="results"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    var URL='https://ktoyxbqybthleiiiiruv.supabase.co';
    var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3l4YnF5YnRobGVpaWlpcnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjgxMTEsImV4cCI6MjEwODk0NDExMX0.WXG-PEHLQemBthQNgiY8h4xPww-96cxUT2nPnOo1NH4';
    var client=null,me=null,hiddenIds={},blockedIds={};
    function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

    function loadMeta(){
      return Promise.all([
        client.from('hidden_chats').select('peer_id').eq('user_id',me.id),
        client.from('blocks').select('blocked_id').eq('blocker_id',me.id)
      ]).then(function(res){
        hiddenIds={}; (res[0].data||[]).forEach(function(r){hiddenIds[r.peer_id]=true});
        blockedIds={}; (res[1].data||[]).forEach(function(r){blockedIds[r.blocked_id]=true});
      });
    }

    function search(term){
      var status=document.getElementById('status'),results=document.getElementById('results');
      status.style.display='block';status.textContent='Searching…';results.innerHTML='';
      var q=client.from('profiles').select('id,username,full_name,avatar_url,bio').neq('id',me.id).order('username').limit(50);
      if(term&&term.trim()){var t=term.trim().toLowerCase();q=q.or('username.ilike.%'+t+'%,full_name.ilike.%'+t+'%')}
      q.then(function(r){
        status.style.display='none';
        if(r.error){results.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}
        var list=(r.data||[]).filter(function(u){return !hiddenIds[u.id]});
        if(!list.length){results.innerHTML='<div class="empty">No people found.</div>';return}
        results.innerHTML=list.map(function(u){
          var badge=blockedIds[u.id]?' <span style="color:#dc2626;font-size:11px">blocked</span>':'';
          return '<div class="user-card" data-id="'+u.id+'" data-username="'+esc(u.username)+'">'+
            '<div class="av">'+(u.avatar_url?'<img src="'+esc(u.avatar_url)+'" alt="">':'👤')+'</div>'+
            '<div class="info"><div class="name">'+esc(u.full_name||u.username)+badge+'</div><div class="uname">@'+esc(u.username)+'</div>'+
            (u.bio?'<div class="bio">'+esc(u.bio)+'</div>':'')+'</div><div class="go">Chat →</div></div>';
        }).join('');
        results.querySelectorAll('.user-card').forEach(function(card){
          card.addEventListener('click',function(){
            location.href='chat.html?with='+encodeURIComponent(card.dataset.id)+'&u='+encodeURIComponent(card.dataset.username);
          });
        });
      });
    }

    function openVault(){
      document.getElementById('vaultModal').classList.add('open');
      var list=document.getElementById('vaultList');
      list.innerHTML='<div class="loading">Loading…</div>';
      client.from('hidden_chats').select('peer_id').eq('user_id',me.id).then(function(h){
        var ids=(h.data||[]).map(function(x){return x.peer_id});
        if(!ids.length){list.innerHTML='<div class="empty">No hidden chats.</div>';return}
        client.from('profiles').select('id,username,full_name,avatar_url').in('id',ids).then(function(r){
          if(r.error||!r.data||!r.data.length){list.innerHTML='<div class="empty">No hidden chats.</div>';return}
          list.innerHTML=r.data.map(function(u){
            return '<div class="user-card" style="cursor:default">'+
              '<div class="av">'+(u.avatar_url?'<img src="'+esc(u.avatar_url)+'" alt="">':'👤')+'</div>'+
              '<div class="info"><div class="name">'+esc(u.full_name||u.username)+'</div><div class="uname">@'+esc(u.username)+'</div></div>'+
              '<button type="button" class="unhide-btn" data-id="'+u.id+'">Unhide</button>'+
              '<button type="button" class="unhide-btn" data-open="'+u.id+'" data-u="'+esc(u.username)+'" style="background:#1a56db;color:#fff">Open</button></div>';
          }).join('');
          list.querySelectorAll('[data-id]').forEach(function(btn){
            btn.addEventListener('click',function(){
              var id=btn.dataset.id;
              client.from('hidden_chats').delete().eq('user_id',me.id).eq('peer_id',id).then(function(){
                delete hiddenIds[id]; openVault(); search(document.getElementById('q').value);
              });
            });
          });
          list.querySelectorAll('[data-open]').forEach(function(btn){
            btn.addEventListener('click',function(){
              location.href='chat.html?with='+encodeURIComponent(btn.dataset.open)+'&u='+encodeURIComponent(btn.dataset.u);
            });
          });
        });
      });
    }

    // Secret: triple-tap logo within 800ms
    var taps=0,tapTimer=null;
    document.getElementById('logoTap').addEventListener('click',function(e){
      e.preventDefault();
      taps++;
      clearTimeout(tapTimer);
      if(taps>=3){taps=0;openVault();return}
      tapTimer=setTimeout(function(){taps=0},800);
    });
    document.getElementById('closeVault').addEventListener('click',function(){document.getElementById('vaultModal').classList.remove('open')});
    document.getElementById('vaultModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open')});

    function boot(){
      if(typeof window.supabase==='undefined'){document.getElementById('results').innerHTML='<div class="error">CDN failed.</div>';return}
      client=window.supabase.createClient(URL,KEY);
      client.auth.getSession().then(function(r){
        if(!r.data||!r.data.session){location.href='login.html';return}
        me=r.data.session.user;
        client.from('profiles').select('*').eq('id',me.id).single().then(function(pr){
          var p=pr.data;
          document.getElementById('me-name').textContent=(p&&p.username)||me.email||'You';
          if(p&&p.avatar_url)document.getElementById('me-av').innerHTML='<img src="'+esc(p.avatar_url)+'" alt="">';
        });
        loadMeta().then(function(){search('')});
      });
    }
    document.getElementById('searchBtn').addEventListener('click',function(){search(document.getElementById('q').value)});
    document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();search(e.target.value)}});
    document.getElementById('logoutBtn').addEventListener('click',function(){
      if(client)client.auth.signOut().then(function(){location.href='login.html'});
      else location.href='login.html';
    });
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
  })();
  </script>
</body>
</html>
