<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Dashboard · Connapp</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#e8f0fe 0%,#f0f4f8 50%,#fff 100%);color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
    a{text-decoration:none;color:inherit}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
    .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
    .logo-icon{width:26px;height:26px;background:#111;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
    .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .header-actions a,.header-actions button{font-size:13px;color:#4b5563;background:none;border:none;cursor:pointer;font-family:inherit;padding:6px 4px}
    .me-chip{display:flex;align-items:center;gap:6px;font-size:13px;color:#374151;padding:4px 10px;background:#f3f4f6;border-radius:999px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .me-chip .av{width:22px;height:22px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;overflow:hidden}
    .me-chip .av img{width:100%;height:100%;object-fit:cover}
    main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:24px 16px 48px}
    h1{font-size:24px;font-weight:700;margin-bottom:6px}
    .sub{font-size:14px;color:#6b7280;margin-bottom:20px}
    .search-box{display:flex;gap:8px;margin-bottom:18px}
    .search-box input{flex:1;padding:12px 14px;border:1px solid #e5e7eb;border-radius:999px;font-size:16px;background:#fff;outline:none;min-width:0}
    .search-box input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
    .search-box button{padding:0 18px;border-radius:999px;border:none;background:#1a56db;color:#fff;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
    .results{display:flex;flex-direction:column;gap:8px}
    .user-card{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:14px;border:1px solid #f3f4f6;cursor:pointer;transition:border-color .15s,box-shadow .15s}
    .user-card:active,.user-card:hover{border-color:#bfdbfe;box-shadow:0 4px 14px rgba(59,130,246,.1)}
    .user-card .av{width:44px;height:44px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
    .user-card .av img{width:100%;height:100%;object-fit:cover}
    .user-card .info{flex:1;min-width:0}
    .user-card .name{font-weight:600;font-size:15px}
    .user-card .uname{font-size:13px;color:#6b7280}
    .user-card .bio{font-size:12px;color:#9ca3af;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-card .go{font-size:13px;color:#1a56db;font-weight:500;flex-shrink:0}
    .empty,.loading,.error{text-align:center;padding:32px 16px;color:#9ca3af;font-size:14px}
    .error{color:#dc2626}
    .hint{font-size:12px;color:#9ca3af;margin-top:12px;text-align:center}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><span class="logo-icon">▣</span>Connapp</a>
    <div class="header-actions">
      <div class="me-chip" id="me-chip"><span class="av" id="me-av">👤</span><span id="me-name">…</span></div>
      <a href="account.html">Account</a>
      <button type="button" id="logoutBtn">Log out</button>
    </div>
  </header>
  <main>
    <h1>Find people</h1>
    <p class="sub">Search by username or name, then open a private chat.</p>
    <div class="search-box">
      <input type="text" id="q" placeholder="Search username or name…" autocomplete="off">
      <button type="button" id="searchBtn">Search</button>
    </div>
    <div id="status" class="loading" style="display:none">Searching…</div>
    <div id="results" class="results"></div>
    <p class="hint">Tap a person to open a 1:1 chat.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    var URL='https://ktoyxbqybthleiiiiruv.supabase.co';
    var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3l4YnF5YnRobGVpaWlpcnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjgxMTEsImV4cCI6MjEwODk0NDExMX0.WXG-PEHLQemBthQNgiY8h4xPww-96cxUT2nPnOo1NH4';
    var client=null,me=null;
    function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function search(term){
      var status=document.getElementById('status'),results=document.getElementById('results');
      status.style.display='block';status.textContent='Searching…';status.className='loading';results.innerHTML='';
      var q=client.from('profiles').select('id,username,full_name,avatar_url,bio').neq('id',me.id).order('username').limit(40);
      if(term&&term.trim()){var t=term.trim().toLowerCase();q=q.or('username.ilike.%'+t+'%,full_name.ilike.%'+t+'%')}
      q.then(function(r){
        status.style.display='none';
        if(r.error){results.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}
        if(!r.data||!r.data.length){results.innerHTML='<div class="empty">No people found.'+(term?' Try another search.':'')+'</div>';return}
        results.innerHTML=r.data.map(function(u){
          return '<div class="user-card" data-id="'+u.id+'" data-username="'+esc(u.username)+'">'+
            '<div class="av">'+(u.avatar_url?'<img src="'+esc(u.avatar_url)+'" alt="">':'👤')+'</div>'+
            '<div class="info"><div class="name">'+esc(u.full_name||u.username)+'</div><div class="uname">@'+esc(u.username)+'</div>'+
            (u.bio?'<div class="bio">'+esc(u.bio)+'</div>':'')+'</div><div class="go">Chat →</div></div>';
        }).join('');
        results.querySelectorAll('.user-card').forEach(function(card){
          card.addEventListener('click',function(){
            window.location.href='chat.html?with='+encodeURIComponent(card.dataset.id)+'&u='+encodeURIComponent(card.dataset.username);
          });
        });
      });
    }
    function boot(){
      if(typeof window.supabase==='undefined'){document.getElementById('results').innerHTML='<div class="error">Supabase CDN failed to load.</div>';return}
      client=window.supabase.createClient(URL,KEY);
      client.auth.getSession().then(function(r){
        if(!r.data||!r.data.session){window.location.href='login.html';return}
        me=r.data.session.user;
        client.from('profiles').select('*').eq('id',me.id).single().then(function(pr){
          var p=pr.data;
          document.getElementById('me-name').textContent=(p&&p.username)||me.email||'You';
          if(p&&p.avatar_url)document.getElementById('me-av').innerHTML='<img src="'+esc(p.avatar_url)+'" alt="">';
        });
        search('');
      });
    }
    document.getElementById('searchBtn').addEventListener('click',function(){search(document.getElementById('q').value)});
    document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();search(e.target.value)}});
    document.getElementById('logoutBtn').addEventListener('click',function(){
      if(client)client.auth.signOut().then(function(){window.location.href='login.html'});
      else window.location.href='login.html';
    });
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
  })();
  </script>
</body>
</html>
