<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Connapp</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #f0f4f8 50%, #ffffff 100%);
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 18px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: #111; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-actions a, .header-actions button {
      font-size: 14px;
      color: #4b5563;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .header-actions a:hover, .header-actions button:hover { color: #111; }
    .me-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #374151;
      padding: 6px 12px;
      background: #f3f4f6;
      border-radius: 999px;
    }
    .me-chip img, .me-chip .av {
      width: 24px; height: 24px;
      border-radius: 50%;
      object-fit: cover;
      background: #e5e7eb;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 15px;
      color: #6b7280;
      margin-bottom: 28px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .search-box input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      font-size: 15px;
      background: #fff;
      outline: none;
    }
    .search-box input:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .search-box button {
      padding: 0 22px;
      border-radius: 999px;
      border: none;
      background: #1a56db;
      color: #fff;
      font-size: 15px;
      font-weight: 550;
      cursor: pointer;
    }
    .search-box button:hover { opacity: 0.92; }
    .results {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: #fff;
      border-radius: 14px;
      border: 1px solid #f3f4f6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .user-card:hover {
      border-color: #bfdbfe;
      box-shadow: 0 4px 16px rgba(59,130,246,0.1);
    }
    .user-card .av {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #e5e7eb;
      object-fit: cover;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .user-card .av img { width: 100%; height: 100%; object-fit: cover; }
    .user-card .info { flex: 1; min-width: 0; }
    .user-card .name {
      font-weight: 600;
      font-size: 15px;
      color: #111;
    }
    .user-card .uname {
      font-size: 13px;
      color: #6b7280;
    }
    .user-card .bio {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-card .go {
      font-size: 13px;
      color: #1a56db;
      font-weight: 500;
      flex-shrink: 0;
    }
    .empty, .loading, .error {
      text-align: center;
      padding: 40px 20px;
      color: #9ca3af;
      font-size: 15px;
    }
    .error { color: #dc2626; }
    .hint {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <span class="logo-icon">▣</span>
      Connapp
    </a>
    <div class="header-actions">
      <div class="me-chip" id="me-chip">
        <span class="av" id="me-av">👤</span>
        <span id="me-name">…</span>
      </div>
      <a href="account.html">Account</a>
      <button type="button" id="logout-btn">Log out</button>
    </div>
  </header>

  <main>
    <h1>Find people</h1>
    <p class="sub">Search by username or name, then open a private room.</p>

    <div class="search-box">
      <input type="text" id="q" placeholder="Search username or name…" autocomplete="off" />
      <button type="button" id="search-btn">Search</button>
    </div>

    <div id="status" class="loading" style="display:none;">Searching…</div>
    <div id="results" class="results"></div>
    <p class="hint">Click a person to open a 1:1 chat room with them.</p>
  </main>

  <script>
    const SUPABASE_URL = 'https://ktoyxbqybthleiiiiruv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3l4YnF5YnRobGVpaWlpcnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjgxMTEsImV4cCI6MjEwODk0NDExMX0.WXG-PEHLQemBthQNgiY8h4xPww-96cxUT2nPnOo1NH4';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let myProfile = null;

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = session.user;

      const { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      myProfile = profile;
      document.getElementById('me-name').textContent = profile?.username || currentUser.email;
      const av = document.getElementById('me-av');
      if (profile?.avatar_url) {
        av.innerHTML = `<img src="${profile.avatar_url}" alt="" />`;
      }

      // Load recent / all users initially
      await searchUsers('');
    }

    async function searchUsers(term) {
      const status = document.getElementById('status');
      const results = document.getElementById('results');
      status.style.display = 'block';
      status.textContent = 'Searching…';
      status.className = 'loading';
      results.innerHTML = '';

      let query = supabase
        .from('profiles')
        .select('id, username, full_name, avatar_url, bio')
        .neq('id', currentUser.id)
        .order('username')
        .limit(40);

      if (term && term.trim()) {
        const t = term.trim().toLowerCase();
        query = query.or(`username.ilike.%${t}%,full_name.ilike.%${t}%`);
      }

      const { data, error } = await query;

      status.style.display = 'none';

      if (error) {
        results.innerHTML = `<div class="error">Error: ${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        results.innerHTML = `<div class="empty">No people found.${term ? ' Try another search.' : ''}</div>`;
        return;
      }

      results.innerHTML = data.map(u => `
        <div class="user-card" data-id="${u.id}" data-username="${u.username}">
          <div class="av">
            ${u.avatar_url
              ? `<img src="${u.avatar_url}" alt="" />`
              : '👤'}
          </div>
          <div class="info">
            <div class="name">${escapeHtml(u.full_name || u.username)}</div>
            <div class="uname">@${escapeHtml(u.username)}</div>
            ${u.bio ? `<div class="bio">${escapeHtml(u.bio)}</div>` : ''}
          </div>
          <div class="go">Chat →</div>
        </div>
      `).join('');

      results.querySelectorAll('.user-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          const username = card.dataset.username;
          window.location.href = `chat.html?with=${encodeURIComponent(id)}&u=${encodeURIComponent(username)}`;
        });
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('search-btn').addEventListener('click', () => {
      searchUsers(document.getElementById('q').value);
    });
    document.getElementById('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchUsers(e.target.value);
    });
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>
