<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Connapp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #f0f4f8 50%, #ffffff 100%);
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 18px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: #111; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px;
    }
    .home-link { font-size: 15px; color: #4b5563; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
      padding: 36px 32px 28px;
    }
    .card-label { font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
    .card h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    .field { margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      background: #f9fafb;
      outline: none;
    }
    input:focus { border-color: #93c5fd; background: #fff; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #1a56db;
      color: #fff;
      margin-top: 8px;
    }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #6b7280;
    }
    .footer-link a { color: #111; font-weight: 500; }
    #msg {
      display: none;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    #msg.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    #msg.ok {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    #status {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 12px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <span class="logo-icon">▣</span>
      Connapp
    </a>
    <a href="index.html" class="home-link">Home</a>
  </header>

  <main>
    <div class="card">
      <div class="card-label">Welcome back</div>
      <h1>Log in</h1>
      <p class="card-desc">Use the email you used when you created your account.</p>

      <div id="status">Loading…</div>
      <div id="msg"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
      </div>

      <button type="button" class="btn" id="loginBtn">Log in</button>

      <div class="footer-link">
        New to Connapp? <a href="signup.html">Create account</a>
      </div>
    </div>
  </main>

  <!-- Load Supabase after the page, then wire the button -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      var STATUS = document.getElementById('status');
      var MSG = document.getElementById('msg');
      var BTN = document.getElementById('loginBtn');
      var EMAIL = document.getElementById('email');
      var PASS = document.getElementById('password');

      var SUPABASE_URL = 'https://ktoyxbqybthleiiiiruv.supabase.co';
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3l4YnF5YnRobGVpaWlpcnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjgxMTEsImV4cCI6MjEwODk0NDExMX0.WXG-PEHLQemBthQNgiY8h4xPww-96cxUT2nPnOo1NH4';

      var client = null;

      function showError(text) {
        MSG.className = 'error';
        MSG.textContent = text;
      }
      function showOk(text) {
        MSG.className = 'ok';
        MSG.textContent = text;
      }
      function clearMsg() {
        MSG.className = '';
        MSG.textContent = '';
        MSG.style.display = 'none';
      }

      function initClient() {
        if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
          STATUS.textContent = 'Error: Supabase script did not load.';
          showError('Cannot reach Supabase CDN. Check internet, or block on ad-blocker, then refresh.');
          BTN.disabled = true;
          return false;
        }
        try {
          client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          STATUS.textContent = 'Ready';
          return true;
        } catch (e) {
          STATUS.textContent = 'Error creating client';
          showError(e.message || String(e));
          BTN.disabled = true;
          return false;
        }
      }

      function doLogin() {
        clearMsg();
        MSG.style.display = '';

        if (!client) {
          if (!initClient()) return;
        }

        var email = (EMAIL.value || '').trim();
        var password = PASS.value || '';

        if (!email || !password) {
          showError('Enter both email and password.');
          return;
        }

        BTN.disabled = true;
        BTN.textContent = 'Signing in…';
        STATUS.textContent = 'Signing in…';

        client.auth.signInWithPassword({ email: email, password: password })
          .then(function (result) {
            if (result.error) {
              showError(result.error.message);
              BTN.disabled = false;
              BTN.textContent = 'Log in';
              STATUS.textContent = 'Ready';
              return;
            }
            showOk('Success! Redirecting…');
            STATUS.textContent = 'Logged in';
            // small delay so user sees success
            setTimeout(function () {
              window.location.href = 'dash.html';
            }, 400);
          })
          .catch(function (err) {
            showError(err.message || 'Login failed');
            BTN.disabled = false;
            BTN.textContent = 'Log in';
            STATUS.textContent = 'Ready';
          });
      }

      // Wire button — type=button so no form submit ever happens
      BTN.addEventListener('click', doLogin);

      // Enter key on password field
      PASS.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          doLogin();
        }
      });
      EMAIL.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          PASS.focus();
        }
      });

      // Init after a tick so CDN script is parsed
      function tryInit() {
        if (typeof window.supabase !== 'undefined') {
          initClient();
          // already logged in?
          if (client) {
            client.auth.getSession().then(function (res) {
              if (res.data && res.data.session) {
                STATUS.textContent = 'Already logged in — redirecting…';
                window.location.href = 'dash.html';
              }
            });
          }
        } else {
          // wait a bit more for CDN
          setTimeout(function () {
            if (typeof window.supabase !== 'undefined') {
              initClient();
            } else {
              STATUS.textContent = 'Supabase CDN not loaded';
              showError('Script blocked or offline. Disable ad-blocker for this page and refresh.');
            }
          }, 800);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryInit);
      } else {
        tryInit();
      }
    })();
  </script>
</body>
</html>
