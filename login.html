<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Connapp</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #f0f4f8 50%, #ffffff 100%);
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 18px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: #111; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px;
    }
    .home-link { font-size: 15px; color: #4b5563; }
    .home-link:hover { color: #111; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
      width: 100%;
      max-width: 400px;
      padding: 36px 32px 28px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .card-label { font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
    .card h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #111;
    }
    .card-desc {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    .field { margin-bottom: 18px; }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      background: #f9fafb;
      outline: none;
    }
    input:focus {
      border-color: #93c5fd;
      background: #fff;
    }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 44px; }
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 16px;
      padding: 4px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 550;
      border: none;
      cursor: pointer;
      background: #1a56db;
      color: #fff;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.92; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #6b7280;
    }
    .footer-link a { color: #111; font-weight: 500; }
    .error-msg {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #fecaca;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <span class="logo-icon">▣</span>
      Connapp
    </a>
    <a href="index.html" class="home-link">Home</a>
  </header>

  <main>
    <div class="card">
      <div class="card-label">Welcome back</div>
      <h1>Log in</h1>
      <p class="card-desc">Use the email you used when you created your account.</p>

      <div id="error" class="error-msg"></div>

      <!-- method=post + no name attrs = password never appears in URL even if JS fails -->
      <form id="login-form" method="post" action="javascript:void(0)" onsubmit="return handleLogin(event)">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" required autocomplete="current-password" />
            <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
          </div>
        </div>

        <button type="submit" class="btn" id="submit-btn">Log in</button>
      </form>

      <div class="footer-link">
        New to Connapp? <a href="signup.html">Create account</a>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://ktoyxbqybthleiiiiruv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0b3l4YnF5YnRobGVpaWlpcnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjgxMTEsImV4cCI6MjEwODk0NDExMX0.WXG-PEHLQemBthQNgiY8h4xPww-96cxUT2nPnOo1NH4';

    let supabase = null;
    try {
      if (!window.supabase) throw new Error('Supabase library failed to load. Check your internet connection.');
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      document.getElementById('error').textContent = err.message;
      document.getElementById('error').classList.add('show');
    }

    function togglePw() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(e) {
      if (e) e.preventDefault();

      const errEl = document.getElementById('error');
      errEl.classList.remove('show');
      errEl.textContent = '';

      if (!supabase) {
        errEl.textContent = 'Supabase not loaded. Open this page via a local server or check internet.';
        errEl.classList.add('show');
        return false;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errEl.textContent = 'Enter email and password.';
        errEl.classList.add('show');
        return false;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          errEl.textContent = error.message;
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Log in';
          return false;
        }

        // Success — go to dashboard
        window.location.replace('dash.html');
      } catch (err) {
        errEl.textContent = err.message || 'Login failed.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
      return false;
    }

    // If already logged in, skip this page
    if (supabase) {
      supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.replace('dash.html');
      });
    }
  </script>
</body>
</html>
