<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Connapp</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #f0f4f8 50%, #ffffff 100%);
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 18px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: #111;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
    }
    .home-link {
      font-size: 15px;
      color: #4b5563;
    }
    .home-link:hover {
      color: #111;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 400px;
      padding: 36px 32px 28px;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
    .card-label {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 8px;
    }
    .card h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #111;
    }
    .card-desc {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    .field {
      margin-bottom: 18px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      background: #f9fafb;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    input:focus {
      border-color: #93c5fd;
      background: #fff;
    }
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 44px;
    }
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 16px;
      padding: 4px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 550;
      border: none;
      cursor: pointer;
      background: #1a56db;
      color: #fff;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    .btn:hover {
      opacity: 0.92;
    }
    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #6b7280;
    }
    .footer-link a {
      color: #111;
      font-weight: 500;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <span class="logo-icon">▣</span>
      Connapp
    </a>
    <a href="index.html" class="home-link">Home</a>
  </header>

  <main>
    <div class="card">
      <div class="card-label">Welcome back</div>
      <h1>Log in</h1>
      <p class="card-desc">Use the email you verified when you created your account.</p>

      <form action="#" method="post" onsubmit="return false;">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" />
            <button type="button" class="toggle-pw" aria-label="Show password">👁</button>
          </div>
        </div>

        <button type="submit" class="btn">Log in</button>
      </form>

      <div class="footer-link">
        New to Connapp? <a href="signup.html">Create account</a>
      </div>
    </div>
  </main>
</body>
</html>
